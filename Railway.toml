[build]
builder = "nixpacks"

[build.env]
NODE_ENV = "production"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "never"

[[services]]
name = "backend"
rootDirectory = "backend"
startCommand = "python app.py"

[[services]]
name = "frontend"
rootDirectory = "frontend"
buildCommand = "npm install && npm run build"
startCommand = "npx serve -s build -l $PORT"
